; Single-node CouchDB for local development and benchmarking.

[couchdb]
; One node: create the system databases (_users, _replicator) on start-up.
single_node = true
; QuickJS (CouchDB >= 3.4) builds JavaScript views faster and with less memory than the
; default SpiderMonkey engine. The views use plain ES5, so either engine works; remove this
; line to go back to SpiderMonkey. GET /_node/_local/_versions shows the active engine.
js_engine = quickjs

[cluster]
; One copy of every shard, because there is only one node.
n = 1
