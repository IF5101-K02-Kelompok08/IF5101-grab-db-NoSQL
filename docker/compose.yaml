# Project name, following the Part 2 lab (grab-db-lab-postgres). Without it Compose names
# everything after this folder: docker-couchdb-1, docker_couchdb_data, ...
name: grab-db-lab-no_sql

services:
  couchdb:
    build:
      context: .
      dockerfile: Dockerfile.couchdb
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD}
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data

  memcached:
    image: memcached:1.6
    command: ["-m", "128", "-I", "2m"]
    ports:
      - "127.0.0.1:11211:11211"

volumes:
  couchdb_data:
